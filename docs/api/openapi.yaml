openapi: 3.1.0
info:
  title: Shinagawa Booking API
  version: 0.1.0-proposal
  description: Proposed contract. Not connected to the current cesami deployment.
servers:
  - url: /api/v1
paths:
  /venues:
    get:
      operationId: listVenues
      responses:
        "200":
          description: Active booking venues
          content:
            application/json:
              schema:
                type: object
                required: [venues]
                properties:
                  venues:
                    type: array
                    items: { $ref: "#/components/schemas/Venue" }
  /availability:
    get:
      operationId: searchAvailability
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: venue_id, in: query, required: false, schema: { type: string } }
        - { name: time_window, in: query, required: false, schema: { type: string, enum: [morning, afternoon, evening] } }
      responses:
        "200":
          description: Availability generated by the authoritative rules engine
          content:
            application/json:
              schema:
                type: object
                required: [as_of, slots]
                properties:
                  as_of: { type: string, format: date-time }
                  slots: { type: array, items: { $ref: "#/components/schemas/Slot" } }
  /auth/sessions:
    post:
      operationId: createResidentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservation_access_id, birth_date]
              properties:
                reservation_access_id: { type: string, minLength: 12, maxLength: 128 }
                birth_date: { type: string, format: date }
      responses:
        "204": { description: Session established in secure cookie }
        "401": { $ref: "#/components/responses/Problem" }
  /reservation-holds:
    post:
      operationId: createReservationHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties: { slot_id: { type: string } }
      responses:
        "201":
          description: Short-lived hold
          content:
            application/json:
              schema:
                type: object
                required: [hold_id, expires_at]
                properties:
                  hold_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "409": { $ref: "#/components/responses/Problem" }
  /reservations:
    post:
      operationId: confirmReservation
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id, contact]
              properties:
                hold_id: { type: string }
                contact: { $ref: "#/components/schemas/Contact" }
      responses:
        "201":
          description: Reservation committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "#/components/responses/Problem" }
  /reservations/{public_id}:
    get:
      operationId: getReservation
      parameters: [ { $ref: "#/components/parameters/PublicId" } ]
      responses:
        "200":
          description: Reservation visible to authenticated resident
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
    patch:
      operationId: rescheduleReservation
      parameters:
        - { $ref: "#/components/parameters/PublicId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_hold_id]
              properties: { new_hold_id: { type: string } }
      responses:
        "200":
          description: Reservation rescheduled atomically
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "409": { $ref: "#/components/responses/Problem" }
  /reservations/{public_id}/cancel:
    post:
      operationId: cancelReservation
      parameters:
        - { $ref: "#/components/parameters/PublicId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reservation cancelled and slot released
          content: { application/json: { schema: { $ref: "#/components/schemas/Reservation" } } }
        "409": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    PublicId: { name: public_id, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Venue:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string, const: Asia/Tokyo }
    Slot:
      type: object
      required: [slot_id, venue_id, starts_at, ends_at, status, availability_band]
      properties:
        slot_id: { type: string, description: Opaque identifier }
        venue_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [available, full, closed, outside_booking_window] }
        availability_band: { type: string, enum: [many, few, last] }
        remaining: { type: integer, minimum: 0, maximum: 3, description: Returned only for low remaining capacity }
        reason_code: { type: string }
    Contact:
      type: object
      properties:
        email: { type: string, format: email }
        phone: { type: string }
      anyOf: [ { required: [email] }, { required: [phone] } ]
    Reservation:
      type: object
      required: [public_id, slot, status, version]
      properties:
        public_id: { type: string }
        slot: { $ref: "#/components/schemas/Slot" }
        status: { type: string, enum: [confirmed, cancelled, completed, no_show] }
        version: { type: integer, minimum: 1 }
    Problem:
      type: object
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        correlation_id: { type: string }
